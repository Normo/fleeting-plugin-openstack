---
stages:
  - check
  - test
  - build

workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH

default:
  image: golang:1.24

.go_cache: &go_cache
  key:
    files:
      - go.sum
  paths:
    - .cache/gomod
    - .cache/gobuild
  policy: pull

variables:
  GOMODCACHE: ${CI_PROJECT_DIR}/.cache/gomod
  GOCACHE: ${CI_PROJECT_DIR}/.cache/gobuild

lint:
  stage: check
  image: golangci/golangci-lint:v2.12.2
  cache:
    key:
      files:
        - go.sum
      prefix: golangci
    paths:
      - .cache/gomod
      - .cache/golangci-lint
    policy: pull-push
  variables:
    GOLANGCI_LINT_CACHE: ${CI_PROJECT_DIR}/.cache/golangci-lint
  script:
    - golangci-lint run --output.code-climate.path gl-code-quality-report.json
  artifacts:
    when: always
    reports:
      codequality: gl-code-quality-report.json

test:
  stage: test
  cache:
    <<: *go_cache
    policy: pull-push
  before_script:
    - go install gotest.tools/gotestsum@v1.13.0
  script:
    - gotestsum --junitfile report.xml --format testname -- ./...
  artifacts:
    when: always
    reports:
      junit: report.xml

build:all:
  stage: build
  variables:
    GOOS: linux
    CGO_ENABLED: "0"
  cache:
    <<: *go_cache
  script:
    - go build -trimpath
  parallel:
    matrix:
      - GOARCH: [amd64, arm64, arm]
