---
stages:
  - check

workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH

default:
  image: ${CI_DEPENDENCY_PROXY_DIRECT_GROUP_IMAGE_PREFIX}/golang:1.24

variables:
  GOMODCACHE: ${CI_PROJECT_DIR}/.cache/gomod
  GOCACHE: ${CI_PROJECT_DIR}/.cache/gobuild

lint:
  stage: check
  image: ${CI_DEPENDENCY_PROXY_DIRECT_GROUP_IMAGE_PREFIX}/golangci/golangci-lint:v2.12.2
  cache:
    key:
      files:
        - go.sum
      prefix: golangci
    paths:
      - .cache/gomod
      - .cache/golangci-lint
    policy: pull-push
  variables:
    GOLANGCI_LINT_CACHE: ${CI_PROJECT_DIR}/.cache/golangci-lint
  script:
    - golangci-lint run --output.code-climate.path gl-code-quality-report.json
  artifacts:
    when: always
    reports:
      codequality: gl-code-quality-report.json
